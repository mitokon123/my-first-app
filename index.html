<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABYSS CHRONICLE - Monstoria</title>

  <!--
    ▼ このファイルについて

    ゲーム本体は app.html。これはウェブに公開したときの「入口」。

    GitHub Pages などは、フォルダのURLを開くと index.html を探す。
    それが無いと https://＜ユーザー名＞.github.io/my-first-app/ が開けず、
    毎回 app.html まで書いたURLを渡すことになる。
    そこで、ここへ来たら app.html へ送るようにしている。

    ローカルでは今までどおり app.html をダブルクリックすればよい。
  -->
  <meta http-equiv="refresh" content="0; url=app.html">
  <link rel="canonical" href="app.html">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070d;
      color: #9aa4c0;
      font-family: monospace;
      font-size: 14px;
    }
    a { color: #ffd75e; }
  </style>
</head>
<body>
  <!-- 自動で移動しなかった場合のための案内 -->
  <p>読み込み中... <a href="app.html">開かないときはこちら</a></p>
</body>
</html>
